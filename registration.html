<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            padding: 20px;
        }

        .container {
            width: 420px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #007bff;
            cursor: pointer;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 18px 0;
            font-size: 14px;
        }

        .terms input {
            width: auto;
        }

        .terms a {
            color: #007bff;
            text-decoration: none;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #0056b3;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Create Account</h1>

        <p class="subtitle">
            Register your account below
        </p>

        <form id="registrationForm">

            <!-- Full Name -->
            <div class="input-group">
                <label for="fullname">Full Name</label>

                <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <!-- Username -->
            <div class="input-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <!-- Email -->
            <div class="input-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <!-- Course -->
            <div class="input-group">
                <label for="course">Course</label>

                <select id="course" required>
                    <option value="">Select your course</option>
                    <option value="BSIT">
                        BS Information Technology
                    </option>

                    <option value="BSCS">
                        BS Computer Science
                    </option>

                    <option value="BSIS">
                        BS Information Systems
                    </option>

                    <option value="BSE">
                        Bachelor of Secondary Education
                    </option>
                </select>
            </div>

            <!-- Password -->
            <div class="input-group">

                <label for="password">Password</label>

                <div class="password-container">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('password', this)"
                    >
                        Show
                    </button>

                </div>

            </div>

            <!-- Confirm Password -->
            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-container">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        Show
                    </button>

                </div>

            </div>

            <!-- Terms -->
            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">
                    I agree to the
                    <a href="#">Terms and Conditions</a>
                </label>

            </div>

            <!-- Submit -->
            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>

            <p
                id="message"
                class="message"
            ></p>

        </form>

        <!-- Login -->
        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <script>

        // Show / Hide Password
        function togglePassword(inputId, button) {

            const input = document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";
                button.textContent = "Hide";

            } else {

                input.type = "password";
                button.textContent = "Show";

            }
        }


        // Registration Validation
        document
            .getElementById("registrationForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                const message =
                    document.getElementById("message");


                // Check password
                if (password !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    message.style.color = "red";

                    return;
                }


                // Check password length
                if (password.length < 6) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                    message.style.color = "red";

                    return;
                }


                // Successful registration
                message.textContent =
                    "Registration successful!";

                message.style.color = "green";


                // Clear form
                this.reset();

            });

    </script>

</body>
</html>
